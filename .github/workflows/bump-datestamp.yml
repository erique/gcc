name: Bump DATESTAMP

on:
  push:
    branches: [amiga6, human68k]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to bump'
        required: true
        default: 'human68k'
        type: choice
        options: [human68k, amiga6]

concurrency:
  group: bump-datestamp-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'bump version date')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Wait for follow-up commits
        run: sleep 3600

      - name: Update DATESTAMP
        run: date -u '+%y%m%d%H%M%S' > gcc/DATESTAMP

      - name: Commit and push
        run: |
          git pull --ff-only
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gcc/DATESTAMP
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "bump version date"
          git push
